name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture simulator screenshots
        type: boolean
        default: true
      mac_only:
        description: Only build and screenshot the macOS app
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  XCODEGEN_VERSION: 2.46.0

jobs:
  build:
    name: Build iOS + macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          curl -sSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          /tmp/xcodegen/xcodegen/bin/xcodegen generate

      - name: Build macOS app
        id: mac
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Theo.xcodeproj -scheme TheoMac -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee mac-build.log | xcbeautify --renderer github-actions

      - name: Build iOS app (simulator)
        id: ios
        if: ${{ !inputs.mac_only }}
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Theo.xcodeproj -scheme Theo -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-build.log | xcbeautify --renderer github-actions

      - name: Collect compiler errors
        if: steps.mac.outcome == 'failure' || steps.ios.outcome == 'failure'
        run: |
          grep -h -E "error:|warning: .*will be an error" mac-build.log ios-build.log | sort -u | head -200 > errors.txt || true
          cat errors.txt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            mac-build.log
            ios-build.log
            errors.txt
          if-no-files-found: ignore

      - name: Publish build errors to ci-output branch
        if: steps.mac.outcome == 'failure' || steps.ios.outcome == 'failure'
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp errors.txt "$RUNNER_TEMP/out/" 2>/dev/null || true
          gzip -c mac-build.log > "$RUNNER_TEMP/out/mac-build.log.gz" || true
          gzip -c ios-build.log > "$RUNNER_TEMP/out/ios-build.log.gz" || true
          scripts/publish-ci-output.sh "$RUNNER_TEMP/out" "build ${{ github.run_id }} (failed)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail if a build failed
        if: steps.mac.outcome == 'failure' || steps.ios.outcome == 'failure'
        run: exit 1

      - name: Simulator screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots && !inputs.mac_only
        run: |
          set -x
          APP=build/Build/Products/Debug-iphonesimulator/Theo.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shoot() {
            local name=$1; shift
            xcrun simctl terminate "$UDID" at.binisoft.theo 2>/dev/null || true
            xcrun simctl launch "$UDID" at.binisoft.theo -TheoDemo "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          xcrun simctl ui "$UDID" appearance light
          shoot today-light -TheoScreen today
          shoot sidebar-light -TheoScreen sidebar
          shoot upcoming-light -TheoScreen upcoming
          shoot history-light -TheoScreen history
          xcrun simctl ui "$UDID" appearance dark
          shoot today-dark -TheoScreen today
          shoot priority-dark -TheoScreen priority
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "Theo"' --style compact > shots/ios-log.txt 2>&1 || true

      - name: macOS screenshot
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        continue-on-error: true
        run: |
          mkdir -p shots
          APP=build/Build/Products/Debug/Theo.app
          open --stdout "$PWD/shots/mac-stdout.txt" --stderr "$PWD/shots/mac-stdout.txt" "$APP" --args -TheoDemo -TheoScreen today
          sleep 15
          screencapture -x shots/mac-today.png || true
          osascript -e 'tell application "System Events" to get {name, position, size} of every window of process "Theo"' > shots/mac-windows.txt 2>&1 || true
          osascript -e 'tell application "System Events" to set frontmost of first process whose name is "Theo" to true' || true
          osascript -e 'tell application "Theo" to activate' || true
          osascript -e 'tell application "Theo" to reopen' || true
          sleep 4
          screencapture -x shots/mac-today-2.png || true
          osascript -e 'tell application "System Events" to get {name, position, size} of every window of process "Theo"' >> shots/mac-windows.txt 2>&1 || true
          log show --last 3m --predicate 'process == "Theo"' --style compact > shots/mac-log.txt 2>&1 || true

      - name: Publish screenshots to ci-output branch
        if: always() && github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp -R shots "$RUNNER_TEMP/out/" 2>/dev/null || true
          scripts/publish-ci-output.sh "$RUNNER_TEMP/out" "screenshots ${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
