name: TestFlight

# Automatic signing with the App Store Connect API key ("Binisoft CI", Admin):
# no certificates or profiles live in the repo. Build number = workflow run number.
# Runs on GitHub's Macs (free for public repositories); the repository variable MAC_RUNNER
# overrides the runner (docs/self-hosted-runner.md).
# Starts by hand, for a `v*` tag, or for a commit on main whose message contains
# "[testflight]" (how a session without tag access ships a finished, green batch).
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to upload
        type: choice
        options: [both, ios, macos]
        default: both
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  PLATFORMS: ${{ inputs.platforms || 'both' }}

jobs:
  upload:
    name: Archive & upload
    # Pushes to main only ship when the commit asks for it.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[testflight]')
    runs-on: ${{ fromJSON(vars.MAC_RUNNER || '"macos-26"') }}
    timeout-minutes: 60
    # Repository secrets (org secrets don't reach private repos on GitHub Free).
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions > Repository secrets; organization secrets don't reach private repos on GitHub Free)"
            exit 1
          fi

      - name: Select Xcode
        run: scripts/ci/select-xcode.sh

      - name: Generate Xcode project
        run: make generate

      # TestFlight builds sync through CloudKit Production. A build with fields Production
      # doesn't know yet would fail to sync, so stop here until the schema is deployed.
      - name: CloudKit Production has every field
        env:
          CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
        run: |
          if [ -z "$CLOUDKIT_MANAGEMENT_TOKEN" ]; then
            echo "::warning::No CLOUDKIT_MANAGEMENT_TOKEN secret, so the Production schema isn't checked"
            exit 0
          fi
          CONTAINER_ID=$(xcodebuild -project Theo.xcodeproj -target Theo -showBuildSettings 2>/dev/null | awk -F' = ' '$1 ~ /^ *APP_CLOUDKIT_CONTAINER$/ {print $2}')
          xcrun cktool save-token --type management "$CLOUDKIT_MANAGEMENT_TOKEN" >/dev/null 2>&1 \
            || printf '%s\n' "$CLOUDKIT_MANAGEMENT_TOKEN" | xcrun cktool save-token --type management >/dev/null 2>&1 || true
          if ! xcrun cktool export-schema --team-id "$APPLE_TEAM_ID" --container-id "$CONTAINER_ID" \
               --environment production --output-file "$RUNNER_TEMP/production.ckdb"; then
            echo "::warning::Couldn't read the Production schema, so it isn't checked"
            exit 0
          fi
          missing=$(python3 scripts/ci/schema-missing.py cloudkit/schema.ckdb "$RUNNER_TEMP/production.ckdb")
          if [ -n "$missing" ]; then
            echo "$missing" > schema-missing.log
            echo "::error::CloudKit Production is missing fields. Deploy Schema Changes in the CloudKit Console (container $CONTAINER_ID, Development), then run this again."
            echo "$missing"
            exit 1
          fi
          echo "Production has every field."

      # The iOS app embeds the watch app; download the watchOS platform only if it's missing.
      - name: watchOS platform
        if: env.PLATFORMS != 'macos'
        run: |
          SDK=$(xcrun --sdk watchsimulator --show-sdk-version)
          xcrun simctl list runtimes | grep -q "watchOS ${SDK}" || xcodebuild -downloadPlatform watchOS

      - name: API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" | sed 's/\\n/\n/g' > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Automatic signing creates a throwaway development certificate on every fresh GitHub
      # runner; remember what's in the keychain so the run can revoke only its own afterwards.
      # A self-hosted Mac keeps its keychain, so it reuses one certificate and revokes nothing.
      - name: Snapshot signing identities
        run: scripts/ci/ci-certificates.py snapshot "$RUNNER_TEMP/identities-before.txt"

      - name: Archive & upload iOS (with the watch app)
        if: env.PLATFORMS != 'macos'
        run: scripts/ci/archive-upload.sh Theo 'generic/platform=iOS' ios

      - name: Archive & upload macOS
        if: env.PLATFORMS != 'ios'
        run: scripts/ci/archive-upload.sh TheoMac 'generic/platform=macOS' macos

      - name: Revoke this run's development certificate
        if: always() && runner.environment == 'github-hosted'
        continue-on-error: true
        run: scripts/ci/ci-certificates.py revoke-new "$RUNNER_TEMP/identities-before.txt" 2>&1 | tee certificates.log

      - name: Publish logs to ci-testflight branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for f in *.log; do
            [ -f "$f" ] || continue
            grep -E "error|Error|ERROR|warning: .*(sign|profile|entitlement|provision)|Upload|upload|succeeded|failed|FAILED|EXPORT|ARCHIVE" "$f" | tail -300 > "$RUNNER_TEMP/out/${f%.log}-summary.txt" || true
            tail -200 "$f" > "$RUNNER_TEMP/out/${f%.log}-tail.txt" || true
          done
          echo "${{ job.status }} build ${BUILD_NUMBER} ${{ github.sha }}" > "$RUNNER_TEMP/out/status.txt"
          if [ -f schema-missing.log ]; then cp schema-missing.log "$RUNNER_TEMP/out/production-missing.txt"; fi
          scripts/ci/publish-ci-output.sh "$RUNNER_TEMP/out" "testflight ${{ github.run_id }}" ci-testflight

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
