name: CloudKit schema

# Imports cloudkit/schema.ckdb into the app container's Development environment: on its own
# whenever the schema file changes on main, or by hand. Afterwards it has to be deployed to
# Production once in the CloudKit Console (TestFlight and App Store builds use Production;
# Apple offers no API for that step). The ci-cloudkit branch's status.txt says whether
# Production still needs it ("deploy-needed") or already matches ("in-sync").

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [cloudkit/schema.ckdb, .github/workflows/cloudkit-schema.yml]

permissions:
  contents: write

jobs:
  import:
    # GitHub's Macs (free for public repositories); MAC_RUNNER overrides the runner.
    runs-on: ${{ fromJSON(vars.MAC_RUNNER || '"macos-26"') }}
    timeout-minutes: 15
    env:
      CLOUDKIT_MANAGEMENT_TOKEN: ${{ secrets.CLOUDKIT_MANAGEMENT_TOKEN }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      # Reports every secret Theo's workflows use, so one run shows what the repo can see.
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          {
            echo "## Repository secrets"
            echo
            echo "| Secret | Used by | Visible to this repo |"
            echo "| --- | --- | --- |"
            for entry in CLOUDKIT_MANAGEMENT_TOKEN:"CloudKit schema" APPLE_TEAM_ID:"CloudKit schema, TestFlight" \
                         ASC_KEY_ID:TestFlight ASC_ISSUER_ID:TestFlight ASC_KEY_P8:TestFlight; do
              name=${entry%%:*}
              [ -n "${!name}" ] && state="yes" || state="**missing**"
              echo "| \`$name\` | ${entry#*:} | $state |"
            done
            echo
            echo "Missing ones go under Settings > Secrets and variables > Actions > **Repository secrets**."
            echo "Organization secrets don't reach private repositories on GitHub Free."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          missing=""
          for name in CLOUDKIT_MANAGEMENT_TOKEN APPLE_TEAM_ID; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions > Repository secrets; organization secrets don't reach private repos on GitHub Free)"
            exit 1
          fi
      - name: Select Xcode
        env:
          XCODE_APP: /Applications/Xcode_26.6.app
        run: scripts/ci/select-xcode.sh
      - name: Resolve container from Config/Base.xcconfig
        run: |
          make generate
          CONTAINER_ID=$(xcodebuild -project Theo.xcodeproj -target Theo -showBuildSettings 2>/dev/null | awk -F' = ' '$1 ~ /^ *APP_CLOUDKIT_CONTAINER$/ {print $2}')
          [ -n "$CONTAINER_ID" ] || { echo "::error::APP_CLOUDKIT_CONTAINER not found"; exit 1; }
          echo "Container: $CONTAINER_ID"
          echo "CONTAINER_ID=$CONTAINER_ID" >> "$GITHUB_ENV"
      - name: Save token
        run: |
          xcrun cktool save-token --help || true
          xcrun cktool save-token --type management "$CLOUDKIT_MANAGEMENT_TOKEN" \
            || printf '%s\n' "$CLOUDKIT_MANAGEMENT_TOKEN" | xcrun cktool save-token --type management
      - name: Validate and import schema (Development)
        run: |
          xcrun cktool validate-schema --team-id "$APPLE_TEAM_ID" --container-id "$CONTAINER_ID" \
            --environment development --file cloudkit/schema.ckdb || true
          xcrun cktool import-schema --team-id "$APPLE_TEAM_ID" --container-id "$CONTAINER_ID" \
            --environment development --file cloudkit/schema.ckdb
      - name: Export current schemas
        run: |
          xcrun cktool export-schema --team-id "$APPLE_TEAM_ID" --container-id "$CONTAINER_ID" --environment development --output-file development.ckdb
          xcrun cktool export-schema --team-id "$APPLE_TEAM_ID" --container-id "$CONTAINER_ID" --environment production --output-file production.ckdb || true
          echo "--- development"; cat development.ckdb
          echo "--- production"; cat production.ckdb || true
      - name: Next step
        if: success()
        run: |
          {
            echo "## Development schema imported into \`$CONTAINER_ID\`"
            echo
            echo "Last step (TestFlight builds use Production):"
            echo
            echo "1. Open https://icloud.developer.apple.com, choose the Binisoft team"
            echo "2. **CloudKit Database** > container \`$CONTAINER_ID\` > environment **Development**"
            echo "3. **Deploy Schema Changes…** > **Deploy**"
            echo
            if [ -f production.ckdb ] && diff -q <(grep -E "RECORD TYPE|^ *\"?[A-Za-z_]+\"? +(STRING|INT64|DOUBLE|TIMESTAMP|REFERENCE|BYTES|ASSET|LIST)" development.ckdb | sort) \
                                               <(grep -E "RECORD TYPE|^ *\"?[A-Za-z_]+\"? +(STRING|INT64|DOUBLE|TIMESTAMP|REFERENCE|BYTES|ASSET|LIST)" production.ckdb | sort) >/dev/null; then
              echo "Production already matches Development, so nothing to deploy."
            else
              echo "Production doesn't match Development yet, so deploy it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A self-hosted Mac keeps its keychain: don't leave the management token in it.
      - name: Remove token (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        continue-on-error: true
        run: xcrun cktool remove-token --type management || true

      - name: Publish result to ci-cloudkit branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp *.ckdb "$RUNNER_TEMP/out/" 2>/dev/null || true
          missing=""
          if [ -f production.ckdb ]; then missing=$(python3 scripts/ci/schema-missing.py cloudkit/schema.ckdb production.ckdb); fi
          if [ -n "$missing" ]; then state="deploy-needed"; else state="in-sync"; fi
          echo "${{ job.status }} $state ${{ github.sha }}" > "$RUNNER_TEMP/out/status.txt"
          if [ -n "$missing" ]; then echo "$missing" > "$RUNNER_TEMP/out/production-missing.txt"; fi
          scripts/ci/publish-ci-output.sh "$RUNNER_TEMP/out" "cloudkit ${{ github.run_id }}" ci-cloudkit
