name: Theo
options:
  bundleIdPrefix: com.erblinkastrati
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
    THEO_CLOUDKIT_CONTAINER: iCloud.com.erblinkastrati.theo
    THEO_SYNC_ENABLED: "YES"
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

targets:
  Theo:
    type: application
    platform: iOS
    sources:
      - path: Theo/Shared
      - path: Theo/iOS
      - path: Theo/Resources
    settings:
      base:
        PRODUCT_NAME: Theo
        PRODUCT_BUNDLE_IDENTIFIER: com.erblinkastrati.theo
        INFOPLIST_FILE: Config/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS/Theo.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets: []

  TheoMac:
    type: application
    platform: macOS
    sources:
      - path: Theo/Shared
      - path: Theo/macOS
      - path: Theo/Resources
    settings:
      base:
        PRODUCT_NAME: Theo
        PRODUCT_MODULE_NAME: Theo
        PRODUCT_BUNDLE_IDENTIFIER: com.erblinkastrati.theo
        INFOPLIST_FILE: Config/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/macOS/Theo.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets: []
