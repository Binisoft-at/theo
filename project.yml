name: Theo
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

# Identifiers, team and versions come from Config/Base.xcconfig (see docs/setup.md).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

packages:
  TheoCore:
    path: Packages/TheoCore

# One source tree (App/Sources + Shared) for iPhone/iPad and Mac; the watch app shares Shared/.
# The widgets' views (Widgets/Sources/Views) are also built into both apps, for the widget
# gallery (-TheoWidgetGallery) that screenshots them without a device.
targets:
  Theo:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
      - path: Widgets/Sources/Views
    dependencies:
      - package: TheoCore
      - target: TheoWatch
      - target: TheoWidgets
    settings:
      base:
        PRODUCT_NAME: Theo
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS/Theo.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets: []

  TheoMac:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
      - path: Widgets/Sources/Views
    dependencies:
      - package: TheoCore
      - target: TheoMacWidgets
    settings:
      base:
        PRODUCT_NAME: Theo
        PRODUCT_MODULE_NAME: Theo
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/macOS/Theo.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets: []

  # Watch companion, embedded in the iOS app ("Embed Watch Content").
  TheoWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Watch/Resources
      - path: Shared
    dependencies:
      - package: TheoCore
      - target: TheoWatchWidgets
    settings:
      base:
        PRODUCT_NAME: TheoWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_BUNDLE_ID)
        INFOPLIST_FILE: Config/watchOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/watchOS/TheoWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    scheme:
      testTargets: []

  # Widgets read a small snapshot (Shared/Logic/WidgetSnapshot.swift) that the apps write into
  # the shared App Group; the task store itself stays in Theo's own container. Each extension is
  # embedded in its app ("Embed Foundation Extensions"), so the existing schemes build and
  # archive it. No TheoCore: the snapshot carries everything they show.

  # Home Screen, Lock Screen and the Control Center button (iPhone, iPad).
  TheoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets/Sources/Views
      - path: Widgets/Sources/Extension
      - path: Shared/Logic/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_NAME: TheoWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGETS_BUNDLE_ID)
        INFOPLIST_FILE: Config/iOS/TheoWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iOS/TheoWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SKIP_INSTALL: YES

  # Mac desktop and Notification Center widgets.
  TheoMacWidgets:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets/Sources/Views
      - path: Widgets/Sources/Extension
      - path: Shared/Logic/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGETS_BUNDLE_ID)
        INFOPLIST_FILE: Config/macOS/TheoWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/macOS/TheoWidgets.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  # Watch complications, embedded in the watch app.
  TheoWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: WatchWidgets/Sources
      - path: Widgets/Sources/Views
      - path: Shared/Logic/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_NAME: TheoWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(WATCH_WIDGETS_BUNDLE_ID)
        INFOPLIST_FILE: Config/watchOS/TheoWatchWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/watchOS/TheoWatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
